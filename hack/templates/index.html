<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government Command Center | Crowd-Pulse AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --panel: #11141b;
            --accent: #00ffcc;
            --danger: #ff3333;
            --text: #e0e6ed;
            --subtext: #8b949e;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: auto;
        }
        .sidebar {
            width: 250px;
            min-width: 250px;
            background: #0d1117;
            padding: 20px;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 { color: var(--accent); font-size: 1.2rem; }
        .sidebar .badge {
            background: #1f2937;
            padding: 10px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.9rem;
        }
        .main-content {
            flex-grow: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 1.8rem; font-weight: 300; letter-spacing: 2px;}
        .logout { color: #8b949e; text-decoration: none; border: 1px solid #30363d; padding: 8px 15px; border-radius: 5px; }
        .logout:hover { background: #30363d; }
        
        .nodes-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        .camera-node {
            background: var(--panel);
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .alert-banner {
            padding: 18px 24px;
            background: #1c212b;
            border-radius: 10px;
            border-left: 5px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fff;
            font-size: 1.1rem;
        }
        .alert-banner.CRITICAL { border-left-color: var(--danger); }
        .alert-banner.PREDICTIVE_CRITICAL { border-left-color: #ff0000; animation: flash-border 0.5s infinite alternate; }
        
        @keyframes flash-border { from { border-left-color: #ff3333; } to { border-left-color: #ff0000; } }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .metric-card {
            background: #181c25;
            padding: 25px 15px;
            border-radius: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .metric-card h4 { margin: 0; font-size: 0.75rem; color: var(--subtext); text-transform: uppercase; letter-spacing: 1.5px; }
        .metric-card .val { font-size: 2.2rem; font-weight: 500; margin-top: 12px; color: #fff; }
        .metric-card .val span { font-size: 1.2rem; color: var(--subtext); margin-left: 6px; }
        .timeline-box { height: 100px; overflow-y: auto; font-family: monospace; font-size: 0.75rem; color: #a5b4fc; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px;}
        .timeline-box p { margin: 3px 0; border-bottom: 1px solid #1f2937; padding-bottom: 3px; }

        .video-container {
            background: #000;
            border-radius: 12px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border: 1px solid #1f2937;
            overflow: hidden;
        }
        .prediction-stable { color: #facc15 !important; }
        
        .recording-dot {
            position: absolute; top: 25px; left: 25px;
            width: 14px; height: 14px; background: #ff3333; border-radius: 50%;
            box-shadow: 0 0 15px #ff3333;
            animation: pulse-red 1s infinite;
        }
        @keyframes pulse-red { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .timeline-box { height: 80px; overflow-y: auto; font-family: 'Inter', sans-serif; font-size: 0.9rem; color: #94a3b8; border-top: 1px solid #1f2937; padding-top: 20px; margin-top: 5px;}
        .timeline-box p { margin: 5px 0; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>COMMAND CENTER</h2>
    <div class="badge">
        Operator: {{ username }}<br>
        Clearance: Level 4
    </div>
    <div class="badge" style="margin-top:auto;">
        System Uplink: SECURE
    </div>
</div>

<div class="main-content">
    <div class="header">
        <h1>Global Crowd-Pulse Surveillance</h1>
        <a href="/logout" class="logout">Secure Logout</a>
    </div>

    <!-- Facility Intelligence Overview -->
    <div class="camera-node" style="flex-direction: row; align-items: center; justify-content: space-around; background: linear-gradient(90deg, #111827, #1f2937); border-color: var(--accent);">
        <div class="metric-card" style="flex-basis: 30%;">
            <h4>Facility Uplink</h4>
            <div class="val" style="font-size: 1.2rem;">CORE SYNC ACTIVE</div>
        </div>
        <div class="metric-card" style="flex-basis: 30%; border-left: 1px solid #30363d; border-right: 1px solid #30363d;">
            <h4>Total Strategic Population</h4>
            <div id="globalUniqueCount" class="val" style="color: #60a5fa; font-size: 2.2rem;">--</div>
            <div style="font-size: 0.7rem; color: #8b949e; margin-top: 5px;">DE-DUPLICATED UNIQUE ENTITIES</div>
        </div>
        <div class="metric-card" style="flex-basis: 30%;">
            <h4>Security Level</h4>
            <div class="val" style="color: #bef264;">OPTIMAL</div>
        </div>
    </div>

    <!-- JS dynamically injects camera cards here -->
    <div class="nodes-grid" id="nodesGrid">
        <div style="color: #8b949e;">Awaiting uplink telemetry...</div>
    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
